<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: el fondo llega a los bordes; la UI respeta safe-area-inset-* -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <!-- Añadido a pantalla de inicio en iPad: se abre sin la interfaz de Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Iluikali" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <!-- La apariencia se decide antes del primer pintado: sin destello al cargar. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('iluikali-theme')
          var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = dark ? 'dark' : 'light'
          root.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0A0A0C' : '#F2F2F7')
        } catch (e) {}
      })()
    </script>
    <title>Iluikali</title>
    <script type="module" crossorigin src="./assets/index-C8sW46P1.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C8J6GZye.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
